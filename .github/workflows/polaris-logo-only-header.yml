name: Polaris logo-only header fix

on:
  push:
    branches:
      - polaris-preview
    paths:
      - .github/workflows/polaris-logo-only-header.yml

permissions:
  contents: write

jobs:
  fix-header-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polaris-preview
          fetch-depth: 0

      - name: Remove duplicate brand text and show the complete logo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              source = path.read_text(encoding='utf-8')
              updated = source

              updated = re.sub(
                  r'\s*<span class="brand-name"><span>Polaris</span><strong>Wellbeing</strong></span>',
                  '',
                  updated,
              )

              updated = re.sub(
                  r'(<a class="footer-brand"[^>]*>\s*<img[^>]*src="assets/polaris-mark\.png"[^>]*>)\s*<strong>Polaris Wellbeing</strong>(\s*</a>)',
                  r'\1\2',
                  updated,
              )

              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Polaris full-logo lockup: remove duplicate HTML wordmark */'
          override = """

          /* Polaris full-logo lockup: remove duplicate HTML wordmark */
          .brand-name { display: none !important; }
          .brand img {
            width: 148px;
            height: auto;
            max-height: 52px;
            object-fit: contain;
            object-position: left center;
          }
          .footer-brand img {
            width: 156px;
            height: auto;
            max-height: 58px;
            object-fit: contain;
            object-position: left center;
          }
          .footer-brand strong { display: none !important; }

          @media (max-width: 759px) {
            .brand img {
              width: 118px;
              height: auto;
              max-height: 46px;
            }
            .footer-brand img {
              width: 146px;
              height: auto;
            }
          }
          """
          if marker not in css:
              css_path.write_text(css + override, encoding='utf-8')
              changed.append(str(css_path))

          print('Changed files:')
          for item in changed:
              print(' -', item)
          PY

      - name: Verify duplicate website wordmark is gone
        shell: bash
        run: |
          if grep -R --include='*.html' -n '<span class="brand-name"><span>Polaris</span><strong>Wellbeing</strong></span>' .; then
            echo 'Duplicate header wordmark remains' >&2
            exit 1
          fi
          if grep -R --include='*.html' -n '<strong>Polaris Wellbeing</strong>' .; then
            echo 'Duplicate footer wordmark remains' >&2
            exit 1
          fi
          test -f assets/polaris-mark.png
          grep -q 'Polaris full-logo lockup' styles.css

      - name: Commit corrected website header
        shell: bash
        run: |
          git config user.name 'Polaris Preview Bot'
          git config user.email '78444086+citricbloom@users.noreply.github.com'
          git add -- '*.html' styles.css
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Remove duplicate Polaris Wellbeing header text and retain full logo'
            git push origin HEAD:polaris-preview
          fi
