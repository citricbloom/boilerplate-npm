name: Polaris WordPress runtime smoke

on:
  push:
    branches:
      - polaris-preview
    paths:
      - .github/workflows/polaris-wordpress-runtime-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polaris-preview

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start WordPress Playground CLI and verify rendered home page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/polaris-runtime
          : > /tmp/polaris-runtime/cookies.txt
          npx --yes @wp-playground/cli@latest server \
            --blueprint=wordpress-dist/polaris-wordpress-playground-bundle-v1.0.1.zip \
            --port=9400 \
            --verbosity=debug \
            > /tmp/polaris-runtime/playground.log 2>&1 &
          echo $! > /tmp/polaris-runtime/playground.pid

          status=000
          for i in {1..180}; do
            status=$(curl -sS -L --max-redirs 10 --connect-timeout 2 --max-time 12 \
              --cookie /tmp/polaris-runtime/cookies.txt \
              --cookie-jar /tmp/polaris-runtime/cookies.txt \
              -D /tmp/polaris-runtime/headers.txt \
              -o /tmp/polaris-runtime/home.html \
              -w '%{http_code}' \
              http://localhost:9400/ || true)
            echo "attempt=$i final_status=$status" >> /tmp/polaris-runtime/curl-status.log
            if [ "$status" = "200" ] && grep -q 'Your life is connected' /tmp/polaris-runtime/home.html; then
              break
            fi
            if ! kill -0 "$(cat /tmp/polaris-runtime/playground.pid)" 2>/dev/null; then
              cat /tmp/polaris-runtime/playground.log
              exit 1
            fi
            sleep 1
          done

          echo "Final HTTP status: $status"
          tail -200 /tmp/polaris-runtime/playground.log || true
          test "$status" = "200"
          test -s /tmp/polaris-runtime/home.html
          grep -q 'Your life is connected' /tmp/polaris-runtime/home.html
          grep -q 'A colourful, welcoming therapy room' /tmp/polaris-runtime/home.html
          if grep -q 'class="button header-cta"' /tmp/polaris-runtime/home.html; then
            echo 'Removed sticky header CTA returned' >&2
            exit 1
          fi
          grep -q 'class="mobile-contact"' /tmp/polaris-runtime/home.html
          grep -q 'wp-content/themes/polaris-wellbeing' /tmp/polaris-runtime/home.html
          echo 'WordPress runtime smoke passed.'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polaris-wordpress-runtime-smoke
          path: /tmp/polaris-runtime
          retention-days: 7
