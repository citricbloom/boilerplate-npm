name: Polaris header CTA and full logo fix

on:
  push:
    branches:
      - polaris-preview
    paths:
      - .github/workflows/polaris-header-logo-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polaris-preview
          fetch-depth: 0

      - name: Apply exact website edits
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            https://polariswellbeing.com/wp-content/uploads/2024/02/cropped-polaris-logo.png \
            --output assets/polaris-mark.png

          # Remove only the button inside the sticky header. The bottom mobile CTA
          # and the in-page Talk to our team buttons deliberately remain.
          sed -i '/<a class="button header-cta" href="talk-to-our-team.html">Talk to our team<\/a>/d' ./*.html

          cat >> styles.css <<'CSS'

/* Founder correction: no CTA inside sticky header; complete logo retained */
.header-cta { display: none !important; }
.brand { flex: 0 0 auto; overflow: visible; }
.brand img {
  display: block !important;
  width: auto !important;
  height: 54px !important;
  max-width: 180px !important;
  max-height: 54px !important;
  object-fit: contain !important;
  object-position: left center !important;
}
.footer-brand {
  display: inline-flex;
  width: fit-content;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--cream);
}
.footer-brand img {
  display: block !important;
  width: auto !important;
  height: 68px !important;
  max-width: 210px !important;
  max-height: 68px !important;
  object-fit: contain !important;
  object-position: left center !important;
}
@media (max-width: 759px) {
  .brand img {
    width: auto !important;
    height: 52px !important;
    max-width: 150px !important;
    max-height: 52px !important;
  }
  .footer-brand img {
    width: auto !important;
    height: 62px !important;
    max-width: 190px !important;
    max-height: 62px !important;
  }
}
CSS

      - name: Verify exact scope
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --include='*.html' -n 'class="button header-cta"' .; then
            exit 1
          fi
          grep -R --include='*.html' -q 'class="mobile-contact"' .
          grep -R --include='*.html' -q '>Talk to our team</a>' .
          python - <<'PY'
          import struct
          with open('assets/polaris-mark.png', 'rb') as file:
              header = file.read(24)
          assert header[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', header[16:24])
          assert width >= 250 and height >= 90 and width > height * 2, (width, height)
          print('Complete logo dimensions:', width, height)
          PY

      - name: Commit website edits
        shell: bash
        run: |
          git config user.name 'Polaris Preview Bot'
          git config user.email '78444086+citricbloom@users.noreply.github.com'
          git add -- '*.html' styles.css assets/polaris-mark.png
          if git diff --cached --quiet; then
            echo 'No changes required.'
          else
            git commit -m 'Remove sticky header CTA and restore complete Polaris logo'
            git push origin HEAD:polaris-preview
          fi
